<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Item | Vulyk</title>
    <link rel="stylesheet" href="/css/retro.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body class="retro-body" data-page="marketplace-create">
<div class="page-shell strict-shell narrow-shell">
    <nav class="command-bar" aria-label="Global command bar">
        <div class="command-links">
            <a class="command-link" href="/web/dashboard">Dashboard</a>
            <a class="command-link" href="/web/marketplace">Marketplace</a>
            <a class="command-link" href="/web/profile">Profile</a>
            <a class="command-link" href="/web/logout">Logout</a>
        </div>
    </nav>

    <section class="window" th:if="${error != null}">
        <div class="window-title">ERROR</div>
        <div class="window-content" th:text="${error}">Error</div>
    </section>

    <section class="window" th:if="${notice != null}">
        <div class="window-title">NOTICE</div>
        <div class="window-content" th:text="${notice}">Notice</div>
    </section>

    <header class="window accent-green">
        <div class="window-title">CREATE ITEM</div>
        <div class="window-content">
            <h1 class="strict-title">NEW LISTING</h1>
            <p class="panel-note">Compose a listing on its own page, then return to the marketplace feed once it is live.</p>
        </div>
    </header>

    <section class="window accent-green">
        <div class="window-title">LISTING COMPOSER</div>
        <div class="window-content">
            <form class="retro-form" method="post" action="/web/marketplace">
                <label for="item-title">Title</label>
                <input id="item-title" name="title" maxlength="100" required>

                <label for="item-category">Category</label>
                <input id="item-category" name="category" maxlength="60">

                <label for="item-price">Price</label>
                <input id="item-price" name="price" type="number" min="0.01" step="0.01" required>

                <label for="item-description">Description</label>
                <textarea id="item-description" name="description" maxlength="2000" required></textarea>

                <div class="panel-action-row">
                    <button type="submit" class="btn btn-success">Create Item</button>
                    <a class="btn" href="/web/marketplace">Back to Marketplace</a>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
