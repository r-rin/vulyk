<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post | Vulyk</title>
    <link rel="stylesheet" href="/css/retro.css">
    <script type="module" src="/js/app.js"></script>
</head>
<body class="retro-body" data-page="post-create">
<div class="page-shell strict-shell narrow-shell">
    <nav class="command-bar" aria-label="Global command bar">
        <div class="command-links">
            <a class="command-link" href="/web/dashboard">Dashboard</a>
            <a class="command-link" href="/web/posts">Posts</a>
            <a class="command-link" href="/web/posts?tab=drafts">Drafts</a>
            <a class="command-link" href="/web/profile">Profile</a>
            <a class="command-link" href="/web/logout">Logout</a>
        </div>
    </nav>

    <section class="window" th:if="${error != null}">
        <div class="window-title">ERROR</div>
        <div class="window-content" th:text="${error}">Error</div>
    </section>

    <section class="window" th:if="${notice != null}">
        <div class="window-title">NOTICE</div>
        <div class="window-content" th:text="${notice}">Notice</div>
    </section>

    <header class="window accent-green">
        <div class="window-title">CREATE POST</div>
        <div class="window-content">
            <h1 class="strict-title">NEW POST</h1>
            <p class="panel-note">Choose whether to publish immediately or keep the post as a draft.</p>
        </div>
    </header>

    <section class="window accent-green">
        <div class="window-title">PUBLISH POST</div>
        <div class="window-content">
            <form class="retro-form" method="post" action="/web/posts">
                <label for="post-title">Title</label>
                <input id="post-title" name="title" maxlength="100" required>

                <label for="post-content">Content</label>
                <textarea id="post-content" name="content" maxlength="1000" required></textarea>

                <label for="post-state">Initial state</label>
                <select id="post-state" name="state">
                    <option value="DRAFT" th:selected="${defaultPostState == 'DRAFT'}">Save as Draft</option>
                    <option value="PUBLISHED" th:selected="${defaultPostState == 'PUBLISHED'}">Publish Now</option>
                </select>

                <div class="panel-action-row">
                    <button type="submit" class="btn btn-primary">Save Post</button>
                    <a class="btn" href="/web/posts">Back to Posts</a>
                </div>
            </form>
        </div>
    </section>
</div>
</body>
</html>
